<!doctype html>
<html lang="vi">

  <link rel="stylesheet" href="style.css">
</head>
<body>

        <linearGradient id="g-ceiling" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#090203"/>
          <stop offset="1" stop-color="#231008"/>

        <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b1510"/>
          <stop offset="0.25" stop-color="#1a0d0b"/>
          <stop offset="1" stop-color="#0a0506"/>
        </linearGradient>
        <radialGradient id="g-glow">
          <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>

        <radialGradient id="g-alcove" cx="0.5" cy="0.6" r="0.65">

          <stop offset="0.55" stop-color="#360c07"/>
          <stop offset="1" stop-color="#1a0504"/>

        <radialGradient id="g-aura" cx="0.5" cy="0.4" r="0.6">
          <stop offset="0" stop-color="#ffd98a" stop-opacity="0.6"/>
          <stop offset="0.6" stop-color="#d9822a" stop-opacity="0.25"/>
          <stop offset="1" stop-color="#7a2a0e" stop-opacity="0.15"/>
        </radialGradient>
        <linearGradient id="g-lacquer" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#360806"/>
          <stop offset="0.35" stop-color="#a8261a"/>
          <stop offset="0.5" stop-color="#d4442e"/>
          <stop offset="0.75" stop-color="#851b12"/>
          <stop offset="1" stop-color="#2a0605"/>
        </linearGradient>
        <linearGradient id="g-board" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5e130c"/>
          <stop offset="1" stop-color="#2a0505"/>

        <linearGradient id="g-table" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8e2016"/>
          <stop offset="1" stop-color="#4a0c08"/>

        <linearGradient id="g-statue" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7e4c10"/>
          <stop offset="0.28" stop-color="#dba443"/>

          <stop offset="1" stop-color="#7e4c10"/>

        <radialGradient id="g-face" cx="0.45" cy="0.4" r="0.7">

          <stop offset="1" stop-color="#a36a1a"/>
        </radialGradient>
        <linearGradient id="g-lotus-gold" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#a8701c"/>
          <stop offset="1" stop-color="#ffe7a2"/>

        <linearGradient id="g-reflect" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c0392b" stop-opacity="0.3"/>
          <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>

        <linearGradient id="g-fade-side" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>

        <linearGradient id="g-fade-top" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d0305"/>
          <stop offset="1" stop-color="#0d0305" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="g-bronze" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5a3b12"/>
          <stop offset="0.35" stop-color="#e2bb63"/>
          <stop offset="0.6" stop-color="#a77a2b"/>

        <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">

          <stop offset="0" stop-color="#e0507a"/>
          <stop offset="1" stop-color="#ffe0ec"/>
        </linearGradient>

        <pattern id="p-niches" width="54" height="70" patternUnits="userSpaceOnUse">

          <circle cx="27" cy="31" r="11" fill="#ffcf6b" opacity=".14"/>
          <circle cx="27" cy="31" r="5.5" fill="url(#g-gold)"/>
          <path d="M15 62Q15 45 27 40Q39 45 39 62Z" fill="url(#g-gold)"/>
          <rect x="11" y="61" width="32" height="5" rx="2" fill="#b07a2a"/>
        </pattern>
        <pattern id="p-curls" width="7" height="7" patternUnits="userSpaceOnUse">
          <rect width="7" height="7" fill="#8a5414"/>
          <circle cx="3.5" cy="3.5" r="2.6" fill="#d9a040"/>

        <path id="gold-petal" d="M0 0C-22 -6 -27 -40 0 -64C27 -40 22 -6 0 0Z" fill="url(#g-lotus-gold)" stroke="#7a4a10" stroke-width="1.5"/>

        <path d="M984 150V176" stroke="#e0b45a" stroke-width="2"/>

      <!-- Polished floor; game.js draws the tiles, carpet and cushions into #floor in perspective. -->

      <circle cx="676" cy="950" r="24" fill="url(#g-glow)" opacity=".7"/>

      <ellipse cx="39" cy="1137" rx="28" ry="6" fill="#000" opacity=".5"/>
      <ellipse cx="241" cy="1137" rx="28" ry="6" fill="#000" opacity=".5"/>

        <rect x="30" y="676" width="18" height="452" fill="url(#g-lacquer)"/>
        <rect x="232" y="676" width="18" height="452" fill="url(#g-lacquer)"/>
        <rect x="24" y="1122" width="30" height="14" rx="2" fill="#e0b45a"/>
        <rect x="226" y="1122" width="30" height="14" rx="2" fill="#e0b45a"/>
        <path d="M6 680Q20 664 44 662H236Q260 664 274 680L268 690H12Z" fill="#6a1810" stroke="#e0b45a" stroke-width="3"/>
      </g>

        <rect x="76" y="912" width="128" height="18" rx="6" fill="url(#g-bronze)"/>
        <path d="M92 770H188M87 846H193" stroke="#6b4a1f" stroke-width="5"/>
        <circle cx="140" cy="884" r="13" fill="#7a5520" stroke="#e2bb63" stroke-width="2"/>
      </g>

    <canvas id="fx" width="1080" height="1920"></canvas>

    <header id="hud">
      <h1>CHÙA ONLINE</h1>
      <p id="total">✨ Công đức: <b id="total-value">0</b></p>
    </header>
    <ul id="guide" class="panel"></ul>
    <div id="toast"></div>
    <div id="welcome"></div>
    <section id="board" class="panel">
      <h2>🏆 Bảng công đức</h2>
      <ol id="top"></ol>
    </section>
    <button id="sound-hint" type="button" hidden>🔇 Bấm vào màn hình để bật âm thanh</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
