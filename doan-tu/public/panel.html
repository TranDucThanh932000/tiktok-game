<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điều khiển · Lớp Học Đoán Từ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #17231d; color: #eef4ea; }
    main { max-width: 620px; padding: 16px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    h2 { margin: 18px 0 8px; font-size: 15px; color: #f5d354; text-transform: uppercase; letter-spacing: 1px; }
    #status { margin: 0; padding: 8px 12px; border-radius: 8px; background: #3a1d24; }
    #status.on { background: #1d3a26; }
    .info { margin: 8px 0 0; padding: 8px 12px; border-radius: 8px; background: #22332a; font-size: 15px; }
    #word b { color: #f5d354; letter-spacing: 1px; }
    #alerts p { margin: 8px 0 0; padding: 8px 12px; border: 1px solid #c0392b; border-radius: 8px; background: #4a1717; font-size: 14px; }
    .hint { margin: 0 0 8px; font-size: 14px; color: #b8c7bb; }
    label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: 14px; }
    input { width: 100%; max-width: 280px; padding: 8px 10px; border: 1px solid #47604f; border-radius: 8px; background: #1f2f27; color: inherit; font: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    button { padding: 9px 14px; border: 1px solid #5d8069; border-radius: 8px; background: #2a4134; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #355341; }
    .gift-icon { width: 28px; height: 28px; margin: -6px 6px -6px -4px; object-fit: contain; vertical-align: middle; }
    .danger { border-color: #a0403a; background: #3a1d1d; }
    #log { min-height: 1.4em; font-size: 14px; color: #b8c7bb; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 3px 8px; border-bottom: 1px solid #2a4134; }
    td:first-child { width: 2.5em; color: #b8c7bb; }
    td:last-child { text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1>✏️ Bảng điều khiển · Lớp Học Đoán Từ</h1>
    <p id="status">Đang kết nối máy chủ game...</p>
    <p class="info" id="word">Chưa có từ nào.</p>
    <p class="info" id="session"></p>
    <div id="alerts"></div>

    <h2>Người chơi giả lập</h2>
    <label>Tên <input id="name" value="Bạn thử" maxlength="20"></label>
    <div class="row">
      <button type="button" id="right">✅ Comment đáp án đúng</button>
      <button type="button" id="wrong">❌ Comment sai</button>
    </div>
    <div class="row" id="gifts"></div>
    <div class="row">
      <button type="button" data-social="follow">➕ Follow</button>
      <button type="button" data-social="share">↗️ Share</button>
    </div>
    <label>Comment bất kỳ (thử cách gõ, ví dụ không dấu) <input id="free" maxlength="100" value=""></label>
    <div class="row"><button type="button" id="free-send">💬 Gửi comment</button></div>

    <h2>Thử đông người</h2>
    <p class="hint">Người thử cũng được lưu vào bảng điểm, nên bấm "Xóa bảng điểm" trước khi live.</p>
    <div class="row">
      <button type="button" id="crowd">👥 10 bạn đoán đúng</button>
      <button type="button" id="crowd40">👥 40 bạn đoán đúng</button>
    </div>

    <h2>Điều khiển</h2>
    <div class="row">
      <button type="button" data-control="letter">🔤 Mở thêm một chữ</button>
      <button type="button" data-control="skip">⏭️ Sang bước tiếp theo</button>
      <button type="button" id="reset" class="danger">🧹 Xóa bảng điểm</button>
      <button type="button" id="telegram-test">📨 Gửi thử Telegram</button>
    </div>
    <p id="log"></p>

    <h2>Bảng điểm (top lớp)</h2>
    <p class="hint" id="players"></p>
    <table><tbody id="ranks"></tbody></table>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const post = (url, body = {}) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const simulate = (body) => post('/api/simulate', { name: $('name').value, ...body });

    let guide = null;
    let botNo = 0;
    // 12 tên ghép 7 họ cho 84 người khác nhau trước khi phải thêm số.
    const FAMILY = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Vũ', 'Đặng'];
    const GIVEN = ['Lan Anh', 'Minh Tú', 'Quốc Bảo', 'Ngọc Mai', 'Đức Huy', 'Bích Ngọc', 'Tuấn Kiệt', 'Hải Yến', 'Gia Hân', 'Thành Đạt', 'Thu Hà', 'Hoàng Nam'];
    const botName = () => {
      const i = botNo++;
      return `${GIVEN[i % GIVEN.length]} ${FAMILY[i % FAMILY.length]}${i >= 84 ? i : ''}`;
    };
    const crowd = (n) => {
      for (let i = 0; i < n; i++) {
        const name = botName();
        setTimeout(() => post('/api/simulate', { kind: 'right', name }), Math.random() * 4000);
      }
    };

    $('right').onclick = () => simulate({ kind: 'right' });
    $('wrong').onclick = () => simulate({ kind: 'chat', text: 'không biết nữa' });
    $('free-send').onclick = async () => {
      const { result } = await (await simulate({ kind: 'chat', text: $('free').value })).json();
      $('log').textContent = result ? `✅ "${$('free').value}" được tính là đúng.` : `❌ "${$('free').value}" không phải đáp án.`;
    };
    for (const button of document.querySelectorAll('[data-social]')) button.onclick = () => simulate({ kind: button.dataset.social });
    for (const button of document.querySelectorAll('[data-control]')) button.onclick = () => post('/api/control', { action: button.dataset.control });
    $('crowd').onclick = () => crowd(10);
    $('crowd40').onclick = () => crowd(40);
    $('reset').onclick = () => {
      if (confirm('Xóa toàn bộ điểm và lượt x2 để bắt đầu buổi mới?')) post('/api/control', { action: 'reset' });
    };
    $('telegram-test').onclick = async () => {
      $('log').textContent = 'Đang gửi tin thử Telegram...';
      const { message } = await (await post('/api/telegram-test')).json();
      $('log').textContent = message;
    };

    function renderGifts() {
      $('gifts').replaceChildren(
        ...guide.tiers.map((tier) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.append(Object.assign(new Image(), { className: 'gift-icon', alt: '', src: tier.icon }), `${tier.label} ${tier.coins} xu · ${tier.turns} lượt`);
          button.onclick = () => simulate({ kind: 'gift', coins: tier.coins, count: 1 });
          return button;
        }),
      );
    }

    function renderBoard(board, players) {
      $('players').textContent = `${players} người có điểm hoặc còn lượt x2. Màn hình hiện ${guide?.seats ?? 0} bạn đầu.`;
      $('ranks').replaceChildren(
        ...board.map((p, i) => {
          const tr = document.createElement('tr');
          const label = [p.name, p.turns > 0 && `· x2 còn ${p.turns} lượt`].filter(Boolean).join(' ');
          for (const text of [`${i + 1}.`, label, p.score]) tr.append(Object.assign(document.createElement('td'), { textContent: text }));
          return tr;
        }),
      );
    }

    // Chủ kênh xem được đáp án ngay từ lúc hỏi, để gợi ý thêm bằng lời nếu muốn.
    let word = null;
    let answer = '';
    let solvedCount = 0;
    async function loadAnswer() {
      answer = (await (await fetch('/api/word')).json()).answer ?? '';
      renderWord();
    }
    function renderWord() {
      if (!word) return;
      const box = $('word');
      box.replaceChildren(`📝 Từ số ${word.no} · ${word.topic} · gợi ý: "${word.hint}" · `);
      const b = document.createElement('b');
      b.textContent = answer ? `Đáp án: ${answer}` : `${word.letters} chữ cái`;
      box.append(b, ` · ${solvedCount} bạn đoán đúng`);
    }

    function loadGame(game) {
      word = game.word;
      solvedCount = game.count;
      loadAnswer();
      renderBoard(game.board, game.players);
    }

    function showStatus({ connected, text }) {
      $('status').textContent = text;
      $('status').classList.toggle('on', connected);
    }
    const showAlert = ({ at, text }) => $('alerts').prepend(Object.assign(document.createElement('p'), { textContent: `⚠️ ${new Date(at).toLocaleTimeString('vi-VN')} TikTok cảnh báo: ${text}` }));
    const showSession = ({ roomId, diamonds, gifts, since }) => {
      $('session').textContent = roomId
        ? `💎 Phiên live này (từ ${new Date(since).toLocaleTimeString('vi-VN')}): ${diamonds.toLocaleString('vi-VN')} kim cương từ ${gifts.toLocaleString('vi-VN')} lượt.`
        : '💎 Chưa có phiên live nào từ lúc bật server.';
    };

    const events = new EventSource('/events');
    events.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      switch (msg.type) {
        case 'snapshot':
          guide = msg.guide;
          renderGifts();
          showStatus(msg.status);
          $('alerts').replaceChildren();
          msg.alerts.forEach(showAlert);
          showSession(msg.session);
          $('log').textContent = `Bộ từ: ${msg.bankSize} từ`;
          loadGame(msg.game);
          break;
        case 'snapshot-game':
          loadGame(msg.game);
          break;
        case 'word':
          word = msg;
          answer = '';
          solvedCount = 0;
          loadAnswer();
          break;
        case 'correct':
          solvedCount = msg.count;
          renderWord();
          break;
        case 'reveal':
          solvedCount = msg.count;
          renderWord();
          break;
        case 'board':
          renderBoard(msg.board, msg.players);
          break;
        case 'boost':
          $('log').textContent = `✨ ${msg.name} +${msg.added} lượt x2 (còn ${msg.turns}).`;
          break;
        case 'status':
          showStatus(msg);
          break;
        case 'moderation':
          showAlert(msg);
          break;
        case 'session':
          showSession(msg);
          break;
      }
    };
    events.onerror = () => showStatus({ connected: false, text: 'Mất kết nối tới máy chủ game, kiểm tra cửa sổ đang chạy npm start.' });
  </script>
</body>
</html>
