<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lớp Học Đoán Từ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="stage">
    <!-- Trang trí 20-11 (Ngày Nhà giáo Việt Nam): mọi thứ có class "deco"; hết dịp thì xóa các khối "deco" và phần CSS "Trang trí 20-11". -->
    <svg class="deco" width="0" height="0" aria-hidden="true">
      <defs>
        <symbol id="d-rose" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="#e83a5a"/>
          <path d="M5 17C7 9 13 4 21 4M35 23c-2 8-8 13-16 13" fill="none" stroke="#ff8fa6" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="11" fill="#cf2348"/>
          <path d="M14 22c-1-5 3-9 8-8 4 1 5 6 2 8s-6 0-5-3" fill="none" stroke="#99103a" stroke-width="2.4" stroke-linecap="round"/>
        </symbol>
        <symbol id="d-daisy" viewBox="0 0 40 40">
          <g fill="#ffd84d" stroke="#eba824" stroke-width="1.4">
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(45 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(90 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(135 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(180 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(225 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(270 20 20)"/>
            <ellipse cx="20" cy="9.5" rx="5" ry="8.5" transform="rotate(315 20 20)"/>
          </g>
          <circle cx="20" cy="20" r="6.5" fill="#f08a24"/>
          <circle cx="18" cy="18" r="2" fill="#ffc26b"/>
        </symbol>
        <symbol id="d-bloom" viewBox="0 0 40 40">
          <g fill="#ffb3cb" stroke="#f27ea3" stroke-width="1.4">
            <circle cx="20" cy="10" r="8"/>
            <circle cx="20" cy="10" r="8" transform="rotate(72 20 20)"/>
            <circle cx="20" cy="10" r="8" transform="rotate(144 20 20)"/>
            <circle cx="20" cy="10" r="8" transform="rotate(216 20 20)"/>
            <circle cx="20" cy="10" r="8" transform="rotate(288 20 20)"/>
          </g>
          <circle cx="20" cy="20" r="5" fill="#fff3a6"/>
        </symbol>
        <symbol id="d-leaf" viewBox="0 0 40 20">
          <path d="M1 10C10 1 28 1 39 10 28 19 10 19 1 10Z" fill="#5cb85c" stroke="#3d8f45" stroke-width="1.5"/>
          <path d="M4 10h30" stroke="#3d8f45" stroke-width="1.5"/>
        </symbol>
        <!-- Chùm hoa góc bảng: một nhánh dọc theo khung trên, một nhánh dọc theo khung bên, chừa chỗ cho chữ chủ đề. -->
        <symbol id="d-corner" viewBox="0 0 150 130">
          <use href="#d-leaf" x="96" y="10" width="40" height="20" transform="rotate(-12 116 20)"/>
          <use href="#d-leaf" x="70" y="20" width="34" height="17" transform="rotate(18 87 28)"/>
          <use href="#d-leaf" x="10" y="92" width="38" height="19" transform="rotate(75 29 101)"/>
          <use href="#d-leaf" x="24" y="58" width="32" height="16" transform="rotate(40 40 66)"/>
          <use href="#d-daisy" x="44" y="0" width="34" height="34"/>
          <use href="#d-bloom" x="76" y="6" width="26" height="26"/>
          <use href="#d-daisy" x="4" y="44" width="34" height="34"/>
          <use href="#d-bloom" x="12" y="76" width="24" height="24"/>
          <use href="#d-rose" x="2" y="0" width="48" height="48"/>
        </symbol>
      </defs>
    </svg>
    <div class="deco" id="d-petals" aria-hidden="true">
      <i style="--x: 40px; --dx: 120px; --t: 13s; --d: -2s"></i>
      <i style="--x: 150px; --dx: -60px; --t: 16s; --d: -9s"></i>
      <i style="--x: 250px; --dx: 90px; --t: 12s; --d: -5s"></i>
      <i style="--x: 360px; --dx: -100px; --t: 15s; --d: -12s"></i>
      <i style="--x: 470px; --dx: 70px; --t: 14s; --d: -1s"></i>
      <i style="--x: 560px; --dx: -80px; --t: 17s; --d: -7s"></i>
      <i style="--x: 650px; --dx: 110px; --t: 12s; --d: -10s"></i>
      <i style="--x: 760px; --dx: -50px; --t: 15s; --d: -4s"></i>
      <i style="--x: 860px; --dx: 80px; --t: 13s; --d: -11s"></i>
      <i style="--x: 960px; --dx: -120px; --t: 16s; --d: -6s"></i>
      <i style="--x: 1040px; --dx: -70px; --t: 14s; --d: -13s"></i>
      <i style="--x: 520px; --dx: 40px; --t: 18s; --d: -15s"></i>
    </div>

    <section id="board">
      <header class="board-head">
        <span id="topic" class="pill"></span>
        <span id="players"></span>
        <span class="spacer"></span>
        <span id="counter"></span>
        <span id="timer" class="pill"></span>
      </header>

      <div id="hintbox">
        <label>GỢI Ý</label>
        <p id="hint"></p>
      </div>

      <div id="tiles"></div>
      <p id="meta"></p>

      <div id="solvers">
        <label id="solved-count"></label>
        <div id="chips"></div>
      </div>

      <p id="footline"></p>
      <div class="timebar"><i id="timefill"></i></div>

      <svg class="doodle star1" viewBox="0 0 40 40"><path d="M20 3l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z" fill="none" stroke="#f6f3e6" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <svg class="doodle smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#f2d04f" stroke-width="2.5"/><circle cx="14" cy="16" r="2" fill="#f2d04f"/><circle cx="26" cy="16" r="2" fill="#f2d04f"/><path d="M12 24q8 8 16 0" fill="none" stroke="#f2d04f" stroke-width="2.5" stroke-linecap="round"/></svg>

    </section>

    <div class="deco" id="d-ribbon" aria-hidden="true">
      <svg viewBox="0 0 40 40"><use href="#d-daisy"/></svg>
      <span>Mừng ngày Nhà giáo Việt Nam 20-11</span>
      <svg viewBox="0 0 40 40"><use href="#d-daisy"/></svg>
    </div>
    <svg class="deco d-corner left" viewBox="0 0 150 130" aria-hidden="true"><use href="#d-corner"/></svg>
    <svg class="deco d-corner right" viewBox="0 0 150 130" aria-hidden="true"><use href="#d-corner"/></svg>

    <!-- Dải quà ngay dưới bảng: hình quà và chuyện xảy ra trong lớp, không dùng chữ "tặng quà". -->
    <div id="menu"></div>

    <aside id="guide"></aside>

    <!-- Ghế VIP dưới mép trái bảng: người gửi Tim cam cuối cùng ngồi quay mặt ra người xem. -->
    <div id="vip" class="empty">
      <div class="vip-label">👑 HỌC SINH VIP</div>
      <svg class="vip-chair" viewBox="0 0 170 200" aria-hidden="true">
        <defs>
          <linearGradient id="vip-velvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2344f"/><stop offset="1" stop-color="#9c1630"/></linearGradient>
          <linearGradient id="vip-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a0"/><stop offset=".5" stop-color="#f0b43a"/><stop offset="1" stop-color="#c98a1c"/></linearGradient>
        </defs>
        <path d="M34 168l-8 30M136 168l8 30" stroke="url(#vip-gold)" stroke-width="9" stroke-linecap="round"/>
        <path d="M30 140V44Q30 10 85 6Q140 10 140 44V140Z" fill="url(#vip-velvet)" stroke="url(#vip-gold)" stroke-width="9" stroke-linejoin="round"/>
        <g fill="#7c0f26"><circle cx="62" cy="62" r="3.5"/><circle cx="108" cy="62" r="3.5"/><circle cx="85" cy="88" r="3.5"/><circle cx="62" cy="112" r="3.5"/><circle cx="108" cy="112" r="3.5"/></g>
        <path d="M10 112Q10 100 24 100H44V150H24Q10 150 10 138Z" fill="url(#vip-velvet)" stroke="url(#vip-gold)" stroke-width="7" stroke-linejoin="round"/>
        <path d="M160 112Q160 100 146 100H126V150H146Q160 150 160 138Z" fill="url(#vip-velvet)" stroke="url(#vip-gold)" stroke-width="7" stroke-linejoin="round"/>
        <rect x="24" y="136" width="122" height="34" rx="12" fill="url(#vip-velvet)" stroke="url(#vip-gold)" stroke-width="7"/>
      </svg>
      <div id="vip-photo"><img id="vip-img" alt="" referrerpolicy="no-referrer" hidden><div id="vip-face" hidden></div></div>
      <div id="vip-kid"><i class="kid"></i></div>
      <div id="vip-how"><img id="vip-how-icon" alt=""><span>còn trống</span></div>
      <b id="vip-name"></b>
    </div>

    <!-- Lẵng hoa trên bục cạnh bàn cô và dây hoa viền mép bục giảng (trang trí 20-11). -->
    <svg class="deco" id="d-basket" viewBox="0 0 120 104" aria-hidden="true">
      <path d="M20 64C18 8 102 8 100 64" fill="none" stroke="#b9772f" stroke-width="5" stroke-linecap="round"/>
      <use href="#d-leaf" x="0" y="50" width="34" height="17" transform="rotate(-25 17 58)"/>
      <use href="#d-leaf" x="86" y="50" width="34" height="17" transform="rotate(25 103 58)"/>
      <use href="#d-leaf" x="40" y="18" width="30" height="15" transform="rotate(-60 55 25)"/>
      <use href="#d-bloom" x="4" y="46" width="24" height="24"/>
      <use href="#d-bloom" x="92" y="46" width="24" height="24"/>
      <use href="#d-daisy" x="30" y="40" width="28" height="28"/>
      <use href="#d-daisy" x="62" y="40" width="28" height="28"/>
      <use href="#d-rose" x="14" y="28" width="30" height="30"/>
      <use href="#d-rose" x="76" y="28" width="30" height="30"/>
      <use href="#d-rose" x="44" y="20" width="32" height="32"/>
      <path d="M12 64H108L98 100H22Z" fill="#dc9a52" stroke="#a9682a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 76H103M20 88H100" stroke="#b9772f" stroke-width="2"/>
      <rect x="30" y="72" width="60" height="20" rx="4" fill="#e23a4c" stroke="#ffd84d" stroke-width="2"/>
      <text x="60" y="87" text-anchor="middle" fill="#ffe680" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="15">20-11</text>
    </svg>
    <svg class="deco" id="d-garland" viewBox="0 0 1080 44" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="d-garland-tile" width="130" height="44" patternUnits="userSpaceOnUse">
          <path d="M0 30C30 30 40 12 65 12S100 30 130 30" fill="none" stroke="#4f9d55" stroke-width="4"/>
          <use href="#d-leaf" x="28" y="14" width="26" height="13" transform="rotate(-25 41 20)"/>
          <use href="#d-leaf" x="76" y="14" width="26" height="13" transform="rotate(25 89 20)"/>
          <use href="#d-bloom" x="10" y="18" width="20" height="20"/>
          <use href="#d-daisy" x="100" y="18" width="22" height="22"/>
          <use href="#d-rose" x="50" y="0" width="30" height="30"/>
        </pattern>
      </defs>
      <rect width="1080" height="44" fill="url(#d-garland-tile)"/>
    </svg>

    <div id="teacher"></div>
    <div id="class"></div>
    <div id="toast" hidden></div>
    <div id="bubble" hidden></div>
    <div id="spotlight" hidden>
      <div class="spot-rays"></div>
      <div class="spot-card">
        <div class="spot-title">⚡ NHANH NHẤT ⚡</div>
        <div class="spot-photo">
          <img id="spot-img" alt="" referrerpolicy="no-referrer">
          <div id="spot-face" class="up"></div>
          <span class="spot-crown">👑</span>
        </div>
        <div id="spot-name"></div>
        <div id="spot-info"></div>
      </div>
    </div>
    <div id="candy" hidden>
      <div class="candy-title">🍬 CÔ PHÁT KẸO CẢ LỚP 🍭</div>
      <div id="candy-thanks"></div>
    </div>
    <div id="fx"></div>
    <div id="sound-hint">Bấm vào màn hình để bật âm thanh</div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
