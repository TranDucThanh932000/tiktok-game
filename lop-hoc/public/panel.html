<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điều khiển · Lớp Học</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #17231d; color: #eef4ea; }
    main { max-width: 620px; padding: 16px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    h2 { margin: 18px 0 8px; font-size: 15px; color: #f5d354; text-transform: uppercase; letter-spacing: 1px; }
    #status { margin: 0; padding: 8px 12px; border-radius: 8px; background: #3a1d24; }
    #status.on { background: #1d3a26; }
    .info { margin: 8px 0 0; padding: 8px 12px; border-radius: 8px; background: #22332a; font-size: 15px; }
    #safe-box { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 12px; border: 1px solid #47604f; border-radius: 8px; font-size: 14px; }
    #safe-box.on { border-color: #f5d354; background: #4a3a10; }
    #safe-box span { flex: 1; }
    #alerts p { margin: 8px 0 0; padding: 8px 12px; border: 1px solid #c0392b; border-radius: 8px; background: #4a1717; font-size: 14px; }
    .hint { margin: 0 0 8px; font-size: 14px; color: #b8c7bb; }
    label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: 14px; }
    input { width: 100%; max-width: 280px; padding: 8px 10px; border: 1px solid #47604f; border-radius: 8px; background: #1f2f27; color: inherit; font: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    button { padding: 9px 14px; border: 1px solid #5d8069; border-radius: 8px; background: #2a4134; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #355341; }
    .gift-icon { width: 28px; height: 28px; margin: -6px 6px -6px -4px; object-fit: contain; vertical-align: middle; }
    .danger { border-color: #a0403a; background: #3a1d1d; }
    #log { min-height: 1.4em; font-size: 14px; color: #b8c7bb; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 3px 8px; border-bottom: 1px solid #2a4134; }
    td:last-child { text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1>🎓 Bảng điều khiển · Lớp Học</h1>
    <p id="status">Đang kết nối máy chủ game...</p>
    <p class="info" id="class-info"></p>
    <p class="info" id="session"></p>
    <p class="info" id="tts"></p>
    <div id="alerts"></div>
    <div id="safe-box"><span id="safe"></span><button type="button" id="safe-toggle"></button></div>

    <h2>Học sinh giả lập</h2>
    <label>Tên <input id="name" value="Bạn thử" maxlength="20"></label>
    <div class="row">
      <button type="button" data-chat="vào">🚪 Chat VÀO</button>
      <button type="button" data-chat="A">A</button>
      <button type="button" data-chat="B">B</button>
      <button type="button" data-chat="C">C</button>
      <button type="button" data-chat="D">D</button>
    </div>
    <div class="row" id="gifts"></div>
    <div class="row">
      <button type="button" data-social="follow">➕ Follow</button>
      <button type="button" data-social="share">↗️ Share</button>
    </div>
    <label>Comment bất kỳ (thử cô đáp lại, ví dụ "chào cô") <input id="free" maxlength="100" value="chào cô"></label>
    <div class="row"><button type="button" id="free-send">💬 Gửi comment</button></div>

    <h2>Thử đông người</h2>
    <p class="hint">Người thử cũng được lưu vào lớp, nên bấm "Mở lớp mới" trước khi live.</p>
    <div class="row">
      <button type="button" id="crowd">👥 Cho đủ cả lớp vào</button>
      <button type="button" id="crowd5">👥 Thêm 5 người</button>
      <button type="button" id="all-answer">🙋 Cả lớp trả lời ngẫu nhiên</button>
    </div>

    <h2>Điều khiển</h2>
    <div class="row">
      <button type="button" id="skip">⏭️ Sang bước tiếp theo</button>
      <button type="button" id="reset" class="danger">🧹 Mở lớp mới (xóa hết)</button>
      <button type="button" id="telegram-test">📨 Gửi thử Telegram</button>
    </div>
    <p id="log"></p>

    <h2>Bảng điểm</h2>
    <table><tbody id="ranks"></tbody></table>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const post = (url, body = {}) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const chat = (name, text) => post('/api/simulate', { kind: 'chat', name, text });

    let guide = null;
    let seated = [];
    let botNo = 0;
    // 12 tên ghép 7 họ cho 84 người khác nhau trước khi phải thêm số.
    const FAMILY = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Vũ', 'Đặng'];
    const GIVEN = ['Lan Anh', 'Minh Tú', 'Quốc Bảo', 'Ngọc Mai', 'Đức Huy', 'Bích Ngọc', 'Tuấn Kiệt', 'Hải Yến', 'Gia Hân', 'Thành Đạt', 'Thu Hà', 'Hoàng Nam'];
    const botName = () => {
      const i = botNo++;
      return `${GIVEN[i % GIVEN.length]} ${FAMILY[i % FAMILY.length]}${i >= 84 ? i : ''}`;
    };

    for (const button of document.querySelectorAll('[data-chat]')) button.onclick = () => chat($('name').value, button.dataset.chat);
    for (const button of document.querySelectorAll('[data-social]')) button.onclick = () => post('/api/simulate', { kind: button.dataset.social, name: $('name').value });
    $('free-send').onclick = () => chat($('name').value, $('free').value);
    let safeMode = false;
    function showSafeMode(on) {
      safeMode = on;
      $('safe-box').classList.toggle('on', on);
      $('safe').textContent = on ? '🛡️ Chế độ an toàn: BẬT. Cô giáo đang im, lớp vẫn chạy.' : '🛡️ Chế độ an toàn: tắt. Tự bật khi có cảnh báo TikTok.';
      $('safe-toggle').textContent = on ? 'Tắt chế độ an toàn' : 'Bật ngay';
    }
    $('safe-toggle').onclick = () => post('/api/safe-mode', { on: !safeMode });
    $('crowd').onclick = () => {
      for (let i = seated.length; i < guide.seats; i++) chat(botName(), 'vào');
    };
    $('crowd5').onclick = () => {
      for (let i = 0; i < 5; i++) chat(botName(), 'vào');
    };
    $('all-answer').onclick = () => {
      for (const name of seated) setTimeout(() => chat(name, 'ABCD'[Math.floor(Math.random() * 4)]), Math.random() * 3000);
    };
    $('skip').onclick = () => post('/api/skip');
    $('reset').onclick = () => {
      if (confirm('Xóa toàn bộ học sinh, điểm và lượt x2 để mở lớp mới?')) post('/api/reset');
    };
    $('telegram-test').onclick = async () => {
      $('log').textContent = 'Đang gửi tin thử Telegram...';
      const { message } = await (await post('/api/telegram-test')).json();
      $('log').textContent = message;
    };

    function renderGifts() {
      $('gifts').replaceChildren(
        ...guide.tiers.map((tier) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.append(Object.assign(new Image(), { className: 'gift-icon', alt: '', src: tier.icon }), `${tier.label} ${tier.coins} xu · ${tier.turns} lượt`);
          button.onclick = () => post('/api/simulate', { kind: 'gift', name: $('name').value, coins: tier.coins, count: 1 });
          return button;
        }),
      );
    }

    // Bảng điểm dựng từ các tin của lớp.
    const students = new Map();
    let officers = [];
    let waiting = 0;
    let phaseNote = '';
    function renderRanks() {
      seated = [...students.values()].map((s) => s.name);
      const titles = new Map(officers.map((o) => [o.seat, o.title]));
      const rows = [...students.entries()].sort(([, a], [, b]) => b.score - a.score);
      $('ranks').replaceChildren(
        ...rows.map(([seat, s]) => {
          const tr = document.createElement('tr');
          const label = [s.name, titles.get(seat) && `(${titles.get(seat)})`, s.turns > 0 && `x2 còn ${s.turns} lượt`].filter(Boolean).join(' ');
          tr.append(Object.assign(document.createElement('td'), { textContent: label }), Object.assign(document.createElement('td'), { textContent: s.score }));
          return tr;
        }),
      );
      $('class-info').textContent = `🎒 Sĩ số ${students.size}/${guide?.seats ?? 0}${waiting ? `, ${waiting} bạn chờ ngoài cửa` : ''}. ${phaseNote}`;
    }

    function loadGame(game) {
      students.clear();
      game.seats.forEach((s, i) => s && students.set(i, { ...s }));
      officers = game.officers;
      waiting = game.waiting;
      phaseNote = game.no ? `Đang ở câu ${game.no}.` : '';
      renderRanks();
    }

    function showStatus({ connected, text }) {
      $('status').textContent = text;
      $('status').classList.toggle('on', connected);
    }
    const showAlert = ({ at, text }) => $('alerts').prepend(Object.assign(document.createElement('p'), { textContent: `⚠️ ${new Date(at).toLocaleTimeString('vi-VN')} TikTok cảnh báo: ${text}` }));
    const showSession = ({ roomId, diamonds, gifts, since }) => {
      $('session').textContent = roomId
        ? `💎 Phiên live này (từ ${new Date(since).toLocaleTimeString('vi-VN')}): ${diamonds.toLocaleString('vi-VN')} kim cương từ ${gifts.toLocaleString('vi-VN')} lượt.`
        : '💎 Chưa có phiên live nào từ lúc bật server.';
    };

    const events = new EventSource('/events');
    events.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      switch (msg.type) {
        case 'snapshot':
          guide = msg.guide;
          renderGifts();
          showStatus(msg.status);
          $('alerts').replaceChildren();
          msg.alerts.forEach(showAlert);
          showSession(msg.session);
          $('log').textContent = `Bộ câu hỏi: ${msg.bankSize} câu`;
          $('tts').textContent = msg.tts.enabled ? `🔊 Cô giáo đọc bằng giọng ${msg.tts.voice}` : '🔇 Cô giáo chưa có tiếng: cần VBEE_TOKEN và VBEE_APP_ID trong .env rồi chạy lại server';
          showSafeMode(msg.safeMode);
          loadGame(msg.game);
          break;
        case 'safe-mode':
          showSafeMode(msg.on);
          break;
        case 'speak-error':
          $('log').textContent = `Vbee lỗi: ${msg.message}`;
          break;
        case 'snapshot-game':
          loadGame(msg.game);
          break;
        case 'join':
          students.set(msg.seat, { ...msg.student });
          waiting = msg.waiting;
          renderRanks();
          break;
        case 'waiting':
          waiting = msg.count;
          renderRanks();
          break;
        case 'answer':
          if (students.has(msg.seat)) students.get(msg.seat).turns = msg.turns;
          renderRanks();
          break;
        case 'boost':
          if (students.has(msg.seat)) students.get(msg.seat).turns = msg.turns;
          renderRanks();
          break;
        case 'question':
          phaseNote = `Đang ở câu ${msg.no}.`;
          renderRanks();
          break;
        case 'reveal':
          for (const r of msg.results) if (students.has(r.seat)) students.get(r.seat).score = r.score;
          officers = msg.officers;
          renderRanks();
          break;
        case 'status':
          showStatus(msg);
          break;
        case 'moderation':
          showAlert(msg);
          break;
        case 'session':
          showSession(msg);
          break;
      }
    };
    events.onerror = () => showStatus({ connected: false, text: 'Mất kết nối tới máy chủ game, kiểm tra cửa sổ đang chạy npm start.' });
  </script>
</body>
</html>
