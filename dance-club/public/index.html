<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Dance Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05020c; }
    #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; font-family: "Baloo 2", "Segoe UI", sans-serif; color: #fff; }
    #game { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
    #tags { position: absolute; inset: 0; pointer-events: none; }

    .tag {
      position: absolute; left: 0; top: 0; padding: 2px 14px; border-radius: 999px; white-space: nowrap;
      background: rgba(10, 4, 24, 0.55); border: 2px solid rgba(255, 255, 255, 0.18);
      font-size: 24px; font-weight: 700; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      transition: opacity 0.4s;
    }
    .tag.fresh { background: rgba(123, 47, 247, 0.85); border-color: #fff; }
    .tag.dim { opacity: 0.35; }
    .tag.crew { background: rgba(255, 170, 0, 0.85); border-color: #fff; color: #1a0b00; }
    .tag.performer { display: none !important; }

    #top { position: absolute; left: 0; right: 0; top: 120px; padding: 30px 0 46px; text-align: center; pointer-events: none; transition: opacity 0.6s;
      background: linear-gradient(180deg, rgba(5, 2, 12, 0) 0%, rgba(5, 2, 12, 0.72) 22%, rgba(5, 2, 12, 0.72) 70%, rgba(5, 2, 12, 0) 100%); }
    #stage.performing #top { opacity: 0; }
    #logo {
      font-size: 64px; font-weight: 800; letter-spacing: 3px; line-height: 1;
      background: linear-gradient(90deg, #ff3cac, #b28dff, #2bd2ff); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 60, 172, 0.55));
    }
    #join-hint { margin-top: 8px; font-size: 34px; font-weight: 700; text-shadow: 0 2px 8px #000; }
    #join-hint b { color: #ffe066; font-size: 40px; padding: 0 6px; }
    #gift-hint { font-size: 26px; font-weight: 600; opacity: 0.9; text-shadow: 0 2px 6px #000; }
    #tier-row { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; padding: 0 60px; }
    .chip { font-size: 22px; padding: 1px 12px; border-radius: 999px; background: rgba(10, 4, 24, 0.6); border: 2px solid var(--c); color: #fff; }
    .chip b { color: var(--c); }
    .chip { display: inline-flex; align-items: center; gap: 4px; }
    #swap-hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 2px 20px 2px 8px; border-radius: 999px; font-size: 26px; font-weight: 700;
      background: rgba(10, 4, 24, 0.65); border: 2px solid var(--c, #25f4ee); box-shadow: 0 0 14px var(--c, #25f4ee); text-shadow: 0 2px 6px #000; }
    #swap-hint[hidden] { display: none; }
    #swap-hint b { color: var(--c, #25f4ee); }
    #swap-hint img { width: 50px; height: 50px; object-fit: contain; margin: -6px 0; filter: drop-shadow(0 0 6px var(--c, #25f4ee)); animation: swap-bob 1.6s ease-in-out infinite; }
    @keyframes swap-bob { 50% { transform: translateY(-4px) rotate(-8deg); } }
    .chip img { width: 38px; height: 38px; object-fit: contain; margin: -6px 0 -6px -6px; filter: drop-shadow(0 0 6px var(--c)); }

    #banner {
      position: absolute; left: 50%; top: 400px; transform: translate(-50%, -30px) scale(0.8); opacity: 0;
      min-width: 560px; max-width: 960px; padding: 14px 36px 16px; border-radius: 28px; text-align: center;
      background: linear-gradient(180deg, rgba(20, 6, 40, 0.88), rgba(10, 2, 24, 0.88));
      border: 4px solid var(--c, #fff); box-shadow: 0 0 40px var(--c, #fff), inset 0 0 24px rgba(255,255,255,0.08);
      transition: transform 0.5s cubic-bezier(.2,1.6,.4,1), opacity 0.4s, top 0.7s ease, padding 0.7s; pointer-events: none;
    }
    #banner.compact { top: 150px; padding: 4px 28px 8px; }
    #banner.compact .b-sub { display: none; }
    #banner.compact .b-tier { font-size: 26px; }
    #banner.compact .b-name { font-size: 46px; }
    #banner.compact .b-main img { width: 52px; height: 52px; }
    #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .b-tier { font-size: 36px; font-weight: 800; color: var(--c); letter-spacing: 4px; text-shadow: 0 0 18px var(--c); }
    .b-main { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .b-main img { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--c); object-fit: cover; }
    .b-name { font-size: 64px; font-weight: 800; line-height: 1.1; max-width: 760px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .b-sub { font-size: 26px; opacity: 0.85; }

    #next {
      position: absolute; left: 28px; top: 640px; padding: 10px 18px; border-radius: 18px; min-width: 300px;
      background: rgba(10, 4, 24, 0.62); border: 2px solid rgba(255,255,255,0.15); font-size: 26px; opacity: 0; transition: opacity 0.4s;
    }
    #next.show { opacity: 1; }
    .n-title { font-weight: 800; color: #ffd166; font-size: 24px; }
    .n-row { white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
    .n-row i { font-style: normal; font-weight: 700; font-size: 22px; }
    .n-more { font-size: 22px; opacity: 0.8; }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin-right: 8px; box-shadow: 0 0 8px var(--c); }

    #count {
      position: absolute; right: 28px; top: 640px; padding: 6px 18px; border-radius: 999px;
      background: rgba(10, 4, 24, 0.62); border: 2px solid rgba(255,255,255,0.15); font-size: 28px; font-weight: 700;
    }

    #toasts { position: absolute; left: 28px; top: 860px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast {
      max-width: 720px; padding: 8px 20px; border-radius: 18px; font-size: 28px; line-height: 1.3;
      background: rgba(10, 4, 24, 0.75); border-left: 8px solid var(--c); box-shadow: 0 0 18px rgba(0,0,0,0.4);
      animation: toast-in 0.45s cubic-bezier(.2,1.4,.4,1); transition: opacity 0.5s, transform 0.5s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.out { opacity: 0; transform: translateX(-40px); }
    .toast .coins { color: var(--c); font-weight: 800; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }

    #hearts { position: absolute; inset: 0; pointer-events: none; }
    .heart { position: absolute; top: 1250px; font-size: 52px; animation: heart 3s ease-out forwards; }
    @keyframes heart { from { transform: translateY(0) scale(0.6); opacity: 1; } to { transform: translateY(-620px) scale(1.2); opacity: 0; } }

    #debug { position: absolute; left: 20px; bottom: 20px; font: 22px monospace; color: #9f9; text-shadow: 0 1px 2px #000; white-space: pre; display: none; }
    #debug.on { display: block; }
    #sound-hint {
      position: absolute; left: 50%; top: 46%; transform: translateX(-50%); padding: 22px 36px; border-radius: 22px;
      background: rgba(20, 12, 30, 0.88); font-size: 40px; font-weight: 700; text-align: center; cursor: pointer;
    }
    #offline { position: absolute; right: 20px; bottom: 20px; font-size: 24px; color: #ff8080; display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="tags"></div>
    <div id="top">
      <div id="logo">VIRTUAL DANCE CLUB</div>
      <div id="join-hint"></div>
      <div id="gift-hint">🎁 Hãy thể hiện đẳng cấp của bạn đi</div>
      <div id="tier-row"></div>
      <div id="swap-hint" hidden></div>
    </div>
    <div id="banner"></div>
    <div id="next"></div>
    <div id="count"></div>
    <div id="toasts"></div>
    <div id="hearts"></div>
    <div id="debug"></div>
    <div id="offline">Mất kết nối server…</div>
    <div id="sound-hint" hidden>🔊 Bấm vào đây để bật nhạc</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
