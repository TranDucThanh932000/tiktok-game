<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quán Cô Ba Đầu Hẻm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d1c; }
    #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    canvas { display: block; width: 1080px; height: 1920px; }
    #sound-hint {
      position: absolute; left: 50%; top: 46%; transform: translateX(-50%);
      padding: 22px 36px; border-radius: 22px; background: rgba(20, 12, 30, 0.85); color: #fff3d6;
      font: 700 40px "Baloo 2", "Segoe UI", sans-serif; text-align: center; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1080" height="1920"></canvas>
    <div id="sound-hint" hidden>🔊 Bấm vào đây để bật âm thanh</div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
